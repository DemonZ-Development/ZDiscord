config-version: 15

# /crafty sends the supplied question to CraftyAI and replies privately.
# Requires the CraftyAI Gateway version providing /v1/developer/chat.
# Uses the key's existing request/token quotas; never executes game actions.
craftyai:
  enabled: false
  endpoint: "https://craftyai-gateway.craftyauth.workers.dev/v1/developer/chat"
  api-key: ""
  # Empty lists allow all channels/roles in bot.guild-id when enabled.
  allowed-channels: []
  allowed-roles: []

storage:
  # yaml = flatfile. mysql = requires MySQL 8.0+ (the JDBC driver is bundled).
  type: "yaml"
  mysql:
    host: "localhost"
    port: 3306
    database: "zdiscord"
    username: "root"
    password: ""
    use-ssl: true
    # Verify the server's TLS certificate. Most self-hosted MySQL servers
    # don't have a CA-signed cert, so this is off by default (traffic is
    # still encrypted).
    ssl-verify-certificate: false

bot:
  # Create an app at https://discord.com/developers/applications,
  # give it Gateway Intents (Server Members, Message Content), then
  # copy the token here.
  token: "YOUR_BOT_TOKEN_HERE"
  activity:
    # PLAYING / WATCHING / LISTENING / COMPETING
    type: "WATCHING"
    text: "%online% players online"
  # Right-click your server in Discord > Copy ID (Developer Mode).
  guild-id: "YOUR_GUILD_ID_HERE"

# Right-click a channel in Discord > Copy ID, paste into the
# channel fields below. Leave blank ("") to disable that channel.
channels:
  chat: "YOUR_CHAT_CHANNEL_ID"
  console: ""
  events: ""
  status: ""
  performance: ""
  achievements: ""
  ticket-category: ""
  # /confess posts anonymously here. Disabled if left blank.
  confessions: ""

chat:
  enabled: true
  use-webhooks: true
  # When true, linked players show as their Discord avatar/name
  # in the bridge. Unlinked players always use Minecraft skins.
  prefer-linked-avatar: true
  prefer-linked-name: true
  webhook-name: "%displayname%"
  # "auto" picks the best avatar per player (SkinsRestorer skin when that
  # plugin is installed, mc-heads otherwise, name-based for Bedrock players).
  # Or set a custom format: %uuid% = with dashes, %uuid_nodashes% = without,
  # %name% = player name.
  avatar-url: "auto"
  # Format for messages that appear in Minecraft. Use & color codes.
  minecraft-format: "&9[Discord] &b%name% &8> &f%message%"
  show-attachments: true
  attachment-text: "&e[Attachment] &7(Click to open)"
  # When a Discord message is a reply, show a small quote line above it
  # in Minecraft chat. %reply_name% / %reply_message% placeholders.
  show-replies: true
  reply-format: "&7┌ Replying to &b%reply_name%&7: &f%reply_message%"
  reply-preview-length: 60

events:
  # Channel set in channels.events above. Controls join/quit/death/advancement
  # embeds. Each sub-event can be individually disabled.
  footer-icon: ""
  join:
    enabled: true
    message: "**%player%** joined the server"
    color: "#2ECC71"
    footer-icon: ""
    # Shown to the player the first time they ever join.
    first-join-message: "&aWelcome to the server, &e%player%&a! Type &e/help&a to get started."
    show-first-join-indicator: true
  quit:
    enabled: true
    message: "**%player%** left the server"
    color: "#E74C3C"
    footer-icon: ""
  death:
    enabled: true
    message: "%death_message%"
    color: "#95A5A6"
  advancement:
    enabled: true
    color: "#F1C40F"
    # 0.25 = badge appears if fewer than 25% of players unlocked it.
    rarity-threshold: 0.25
    show-rarity: true

# Auto-updating embed. Use /setup or config channels.status.
status:
  enabled: true
  update-interval: 30
  embed:
    title: "Server Status"
    color: "#5865F2"
    show-players: true
    show-tps: true
    show-memory: true
    server-ip: "play.yourserver.com"

# One combined embed that refreshes itself in a channel: players online,
# TPS, memory, top kills/playtime, most followed. Needs channels set to
# a real channel ID to appear.
live-stats:
  enabled: true
  channel: ""
  # Seconds between refreshes.
  update-interval: 60

# Tracks kills/deaths/playtime. Stats are stored per-player and
# can be viewed with /leaderboard on Discord.
leaderboard:
  enabled: true
  # Number of entries shown per leaderboard page.
  per-page: 10
  panel-channel: ""
  panel-update-interval: 120
  # /leaderboard command replies re-edit themselves with fresh data every
  # N seconds (buttons still work while it does). 0 = post once, no refresh.
  auto-refresh-seconds: 60
  panel-stats:
    - "kills"
    - "deaths"
    - "playtime"

# Creates private Discord channels for support tickets.
tickets:
  enabled: true
  # Staff roles that can see all tickets. Paste role IDs here.
  support-roles: []
  max-per-user: 3
  # Tickets auto-close after this many hours of inactivity. 0 = never.
  auto-close-hours: 48
  panel-channel: ""
  panel:
    title: "Support Center"
    description: |
      Need help? Pick a category below to open a private ticket.
      Our support team will respond as soon as possible.
    color: "#5865F2"
    thumbnail: ""
    image: ""
    footer: "ZDiscord Ticket System"
  # Add or remove categories freely. Each needs a unique id.
  categories:
    - id: "general"
      label: "General Support"
      description: "Questions, account help, or anything else."
      emoji: "💬"
      color: "#5865F2"
    - id: "bug"
      label: "Bug Report"
      description: "Something on the server is broken or behaving oddly."
      emoji: "🐛"
      color: "#E67E22"
    - id: "player"
      label: "Player Report"
      description: "Report a player breaking the rules."
      emoji: "🚨"
      color: "#E74C3C"
    - id: "purchase"
      label: "Purchase Help"
      description: "Need help with a store order or rank?"
      emoji: "🛒"
      color: "#2ECC71"

# Players can link their Discord and Minecraft accounts via
# /zdiscord link in-game then /link on Discord.
linking:
  enabled: true
  # If true, players must link before they can join the server.
  required: false
  # Role ID to auto-assign on Discord when a player links.
  linked-role: ""
  # Console commands to run when a player links. Use %player%.
  rewards: []

anti-raid:
  enabled: true
  # Kicks new joins if >max-joins arrive within time-window (seconds).
  max-joins: 10
  time-window: 30
  lockdown:
    kick-new-joins: true
    kick-message: "&cServer is in lockdown mode. Please try again later."
    notify-staff: true
    # Seconds until lockdown auto-lifts. 0 = manual only.
    auto-lift: 300

performance:
  enabled: true
  update-interval: 60
  # Posts to channels.performance when thresholds are crossed.
  tps-warning: 18.0
  tps-critical: 15.0
  # Percentage of max memory.
  memory-warning: 80

reaction-roles:
  enabled: true
  # Add mappings to the `mappings` list below.
  # Each mapping: message-id, emoji, role-id, and (optional) minecraft permission.
  mappings: []

misc:
  invite-link: "https://discord.gg/yourserver"
  # Prefix for console commands sent from the console channel.
  console-prefix: "!"
  console-role: ""
  # Commands that may be run from the Discord console channel. Empty list = safe
  # defaults (read-only + moderate gameplay commands). Anything not on this list
  # is rejected. Note: op/deop/stop/restart/reload/perms are never allowed here.
  console-allowed-commands: []
  debug: false
  update-checker: true
  update-silent: false
  update-channel: ""

command-logger:
  enabled: true
  channel: ""
  # Logged in yellow. These are matched as prefixes.
  watched-commands:
    - "ban"
    - "kick"
    - "mute"
    - "whitelist"
    - "gamemode"
  # Logged in red.
  critical-commands:
    - "op"
    - "deop"
    - "stop"
    - "restart"

# Staff messages are sent from Minecraft with /sc and replied
# to from the Discord staff-chat channel.
staff-chat:
  enabled: true
  channel: "YOUR_STAFF_CHAT_CHANNEL_ID"

voice-status:
  enabled: true
  # Tracks how many people are in a voice channel and posts
  # live updates to the channels.status embed.
  channel: ""

profile:
  embed:
    color: "#9B59B6"
  # Use the player's real skin texture for profile pictures when
  # SkinsRestorer is installed (soft dependency). Falls back to the
  # default Steve/Alex head otherwise.
  skin-restorer: true

# Optional bridges to other DemonZ plugins. Leave channel empty to use
# channels.events. These hooks load only when the corresponding plugin exists.
integrations:
  onlysleep:
    enabled: true
    channel: ""
  redstone-reboot:
    enabled: true
    channel: ""

# /profile has a Follow button. When the player joins the
# server, followers get a DM notification.
follow:
  enabled: true
  join-notification-cooldown: 300

confessions:
  color: "#9B59B6"
  # Seconds between confessions per user.
  cooldown: 300

# Seasonal Halloween event. The window is expressed as MM-DD; a window whose
# end sorts before its start wraps into the following year (10-28 to 11-02 is
# a five-day hunt). Both default to a single day, 10-31.
#
# Mob kills during the window are tallied separately from normal kills and
# ranked at the end. The tally resets when a new window opens and survives
# server restarts within the same window.
halloween:
  enabled: true
  window-start: "10-31"
  window-end: "10-31"
  # Where the countdown, announcements and standings panel go. Blank uses
  # channels.events.
  channel: ""
  color: "#E67E22"
  # Broadcast messages in-game as well as to Discord.
  greet-players: true
  # Post the winner embed when the window closes.
  announce-finale: true
  # Heading shown above the standings leaderboard.
  trophy-title: "Graveyard King"
  # How many players to rank.
  top-n: 5
  # Announce the countdown once a day during the days before the window
  # opens. Set days: 0 to silence it entirely.
  countdown:
    enabled: true
    days: 7
  # Self-refreshing standings embed, shown for the whole window so the
  # channel reacts to kills without anyone posting manually.
  live-panel:
    enabled: true
    update-interval: 60
  # Announce the first time someone crosses each of these kill counts.
  milestones:
    - 25
    - 50
    - 100
    - 250
    - 500
  # Bosses (ender dragon, wither, elder guardian) count for this many
  # instead of 1. Set to 1 to disable the bonus.
  boss-multiplier: 5
  # Console commands run when the window closes. %player% and %uuid% are
  # replaced. Rewards are only paid for players with at least one kill.
  rewards:
    winner: []
    participant: []

api:
  # Enables the Bukkit API other plugins can hook into.
  enabled: true

logging:
  # Master troubleshooting switch: sets every category to DEBUG and unsuppresses
  # JDA/Hikari logs. Apply with /zdiscord reload. Turn off when you're done -
  # it is very chatty.
  debug: false
  level: INFO
  compact: true
  categories:
    bot: INFO
    storage: WARN
    modules: INFO
    events: INFO
    api: INFO
    setup: INFO
    commands: INFO
    webhook: WARN
  suppress-jda: true
  suppress-hikari: true
