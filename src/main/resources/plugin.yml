name: ZDiscord
version: '${project.version}'
main: dev.demonz.zdiscord.ZDiscord
api-version: '1.20'
description: Discord integration for Minecraft servers
author: DemonZ Development
website: https://demonz.org

folia-supported: true

softdepend:
  - LuckPerms
  - SkinsRestorer
  - Floodgate
  - Geyser-Spigot
  - Onlysleep
  - RedstoneReboot

commands:
  zdiscord:
    description: ZDiscord command
    usage: /<command> [reload|status|diagnostics|link|embed|ticket|halloween|panel|lockdown|update|dump]
    aliases: [zd]
  link:
    description: Link your Minecraft account to Discord
    usage: /<command>
    permission: zdiscord.link
  discord:
    description: Shows the Discord server invite link
    usage: /<command>
    permission: zdiscord.discord
  sc:
    description: Staff chat bridge
    usage: /<command> [message]
    permission: zdiscord.staffchat
    aliases: [staffchat]
  confess:
    description: Post an anonymous confession to the configured Discord channel
    usage: /<command> <message>
    permission: zdiscord.confess

permissions:
  zdiscord.admin:
    description: Access to ZDiscord admin commands
    default: op
  zdiscord.discord:
    description: Allows viewing the Discord invite link
    default: true
  zdiscord.link:
    description: Allows players to link their accounts
    default: true
  zdiscord.chat:
    description: Player chat is forwarded to Discord
    default: true
  zdiscord.ticket:
    description: Allows creating support tickets
    default: true
  zdiscord.halloween:
    description: Allows viewing Halloween event status, personal points, and standings
    default: true
  zdiscord.embed:
    description: Allows sending custom Discord embeds
    default: op
  zdiscord.bypass.antiraid:
    description: Bypass anti-raid checks
    default: op
  zdiscord.bypass.link:
    description: Bypass link-to-join enforcement
    default: op
  zdiscord.staffchat:
    description: Access to staff chat
    default: op
  zdiscord.confess:
    description: Allows posting anonymous confessions
    default: true
