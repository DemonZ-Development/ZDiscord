name: Build

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'pom.xml'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx2048m'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.detect.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Detect release type
        id: detect
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-SNAPSHOT"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Compile and package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn clean package -B -V --no-transfer-progress
        env:
          MAVEN_OPTS: ${{ env.MAVEN_OPTS }}

      - name: Verify build output
        run: |
          JAR="target/ZDiscord-${{ needs.validate.outputs.version }}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Build artifact not found"
            exit 1
          fi

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom version v${VERSION}"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: zdiscord-build-${{ needs.validate.outputs.version }}
          path: target/ZDiscord-${{ needs.validate.outputs.version }}.jar
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: zdiscord-build-${{ needs.validate.outputs.version }}
          path: target

      - name: Generate release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "### Install"
            echo "Download the JAR below and place it in your server's \`plugins/\` folder."
            echo "Verify it with the attached SHA-256 checksum if desired."
          } >> release-notes.md

      - name: Generate checksum
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd target
          sha256sum "ZDiscord-${VERSION}.jar" > "ZDiscord-${VERSION}.jar.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: ZDiscord v${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          files: |
            target/ZDiscord-${{ needs.validate.outputs.version }}.jar
            target/ZDiscord-${{ needs.validate.outputs.version }}.jar.sha256
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
